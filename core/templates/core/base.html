<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Tienda Django{% endblock %}</title>
    <!-- Bootstrap 5 CDN para estilos rápidos y limpios -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <!-- Barra de navegación simple -->
        <nav class="mb-4">
            <a href="{% url 'core:lista_productos' %}" class="btn btn-outline-secondary btn-sm me-2">📦 Productos</a>
            <a href="{% url 'core:crear_producto' %}" class="btn btn-primary btn-sm">➕ Nuevo</a>
            <a href="/admin/" class="btn btn-outline-dark btn-sm ms-2" target="_blank">⚙️ Admin</a>
        </nav>

        <!-- Mensajes de Django (success, error, etc.) -->
        {% if messages %}
            <div class="mb-3">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Contenido principal que cambian las plantillas hijas -->
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS (para alertas dismissible, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
